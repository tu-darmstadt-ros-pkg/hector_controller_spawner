/**:
  ros__parameters:
    # Optional emergency‑stop topic.  Empty → start immediately.
    estop_topic: ''

    # How long to wait between retry attempts (HW + controllers).
    retry_delay: 1.0

    # Bound the worst case well under the launch-test TIMEOUT of 360s:
    # max_attempts * (2 * (2s service wait + service_call_timeout) + retry_delay) ~= 125s.
    # A wedged controller manager has to fail the test, not run into ctest's hard timeout.
    max_attempts: 5
    service_call_timeout_ms: 10000

    # ---------- hardware interfaces (activate = always) ----------
    hardware_interfaces:
    - athena_flipper_interface
    - athena_arm_interface
    # ---------- controllers, in deterministic order -------------
    controllers:
    - joint_state_broadcaster
    - flipper_trajectory_controller
    - vel_to_pos_controller
    - flipper_safety_position_controller
    - flipper_velocity_controller
    - gripper_trajectory_controller
    - arm_trajectory_controller
    - arm_safety_position_controller

    # Per‑controller options
    joint_state_broadcaster:
      activate: true

    flipper_trajectory_controller:
      activate: false

    vel_to_pos_controller:
      activate: true

    flipper_safety_position_controller:
      activate: true

    flipper_velocity_controller:
      activate: true

    gripper_trajectory_controller:
      activate: true

    arm_trajectory_controller:
      activate: true



    arm_safety_position_controller:
      activate: true
