name: Lint, Build & Test
on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]
defaults:
  run:
    shell: bash

jobs:
  Linting:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup
      run: sudo apt-get update && sudo apt-get install -y black clang-format cppcheck libxml2-utils
    - name: Set up Python
      uses: actions/setup-python@v4
    - name: Install and Run pre-commit
      uses: pre-commit/action@v3.0.1
      with:
        extra_args: --all-files

  build-and-test:
    needs: Linting
    strategy:
      matrix:
        setup:
        - rosdistro: jazzy
          os: ubuntu-24.04
    runs-on: ${{ matrix.setup.os }}
    container:
      image: ros:${{ matrix.setup.rosdistro }}-ros-base
    steps:
    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ros-dev-tools python3-vcstool

    - name: Checkout Main Repo
      uses: actions/checkout@v4
      with:
        path: src/main_repo

    - name: Recursive VCS Import
      run: |
        cd src
        # This loop finds .repos files, imports them, and repeats if new ones appear
        # (Up to 15 levels deep to prevent infinite loops)
        for i in {1..15}; do
          echo "Scanning for .repos files (Level $i)..."
          # Find all .repos files in the src directory
          REPOS_FILES=$(find . -name "*.repos")
          if [ -z "$REPOS_FILES" ]; then
            echo "No .repos files found."
            break
          fi

          NEW_CLONES=false
          for f in $REPOS_FILES; do
            # vcs import returns 0 even if nothing changed,
            # but we use it to populate the directory.
            vcs import . < "$f" && NEW_CLONES=true
          done

          if [ "$NEW_CLONES" = false ]; then break; fi
        done

    - name: rosdep
      run: |
        rosdep update --rosdistro ${{ matrix.setup.rosdistro }} --include-eol-distros
        rosdep install -y --from-paths src --ignore-src --rosdistro ${{ matrix.setup.rosdistro }}

    - name: Build
      run: |
        source /opt/ros/${{ matrix.setup.rosdistro }}/setup.bash
        colcon build --event-handlers console_direct+

    - name: Test
      run: |
        source /opt/ros/${{ matrix.setup.rosdistro }}/setup.bash
        colcon test --event-handlers console_direct+
        colcon test-result --verbose
